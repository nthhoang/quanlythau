
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quanlythau_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Nguong xac thuc cham cong
cham-cong:
  nguong-khuon-mat: 0.6

app:
  upload-dir: uploads

# Gemini API dung cho OCR hoa don vat tu
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.6-flash
